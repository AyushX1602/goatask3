[project]
name = "face-chain-verify"
version = "0.1.0"
description = "Face scan -> web/social search -> blockchain-anchored evidence, with re-verification."
requires-python = ">=3.12,<3.13"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["pipeline*"]
